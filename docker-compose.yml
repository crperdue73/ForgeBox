# ============================================================================
#  ForgeBox — Datacenter-in-a-Box
#  One compose file. One command. A datacenter you strike out of spare iron.
#
#  Deploy core:   docker compose up -d
#  Add profiles:  docker compose --profile devops up -d
#  Several:       docker compose --profile devops --profile media up -d
#  Everything:    docker compose --profile "*" up -d   (quote the star!)
#                 (* = every profile, `vpn`/gluetun included — see note below)
#
#  Docs: docs/   ·  Branding: branding/BRAND.md
#  Maintained by CR Perdue Technologies. Project: ForgeBox.
# ============================================================================

name: forgebox

# --- Reusable anchors -------------------------------------------------------
x-restart: &restart
  restart: unless-stopped

x-common: &common
  restart: unless-stopped
  networks: [forgebox]
  environment:
    TZ: ${TZ:-America/New_York}
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}

networks:
  # No fixed `name:` — compose scopes the network to the project directory, so
  # two ForgeBox instances (two students, two lessons) can run side by side.
  forgebox:
    driver: bridge

# ============================================================================
#  CORE  (always deployed — no profile)
# ============================================================================
services:

  portainer:
    <<: *common
    image: portainer/portainer-ce:latest
    command: -H unix:///var/run/docker.sock
    ports: ["9000:9000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    profiles: []

  heimdall:
    <<: *common
    image: lscr.io/linuxserver/heimdall:latest
    ports: ["8080:80", "8443:443"]
    volumes:
      - heimdall_config:/config
    profiles: []

  npm:
    <<: *common
    image: jc21/nginx-proxy-manager:latest
    ports: ["80:80", "443:443", "81:81"]
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    profiles: []

  uptime-kuma:
    <<: *common
    image: louislam/uptime-kuma:1
    ports: ["3001:3001"]
    volumes:
      - uptime_kuma_data:/app/data
    profiles: []

  watchtower:
    <<: *common
    image: containrrr/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ:-America/New_York}
      # Pinned: watchtower 1.7.1's bundled Docker client speaks API 1.25, but
      # Docker Engine >= 25 (here: 29.x) rejects anything < 1.40. Without this
      # watchtower crash-loops with "client version 1.25 is too old".
      # 1.44 is safely within the daemon's supported range.
      DOCKER_API_VERSION: "1.44"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "86400"
      WATCHTOWER_ROLLING_RESTART: "true"
    # NOT core. Auto-update opens one-way doors unattended: nextcloud app
    # versions cannot be downgraded, n8n migrates its SQLite schema with no
    # rollback, and postgres refuses (or worse, silently misses) a data
    # directory from a newer major. A classroom must be able to answer
    # "what version am I on" without a machine changing the answer overnight.
    profiles: [autoupdate]

  glances:
    <<: *common
    image: nicolargo/glances:latest-full
    pid: host
    ports: ["61208:61208"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: ${TZ:-America/New_York}
      GLANCES_OPT: "-w"
    profiles: []

# ============================================================================
#  SECURITY  (--profile security)
# ============================================================================
  pihole:
    <<: *common
    image: pihole/pihole:latest
    ports: ["53:53/tcp", "53:53/udp", "8010:80/tcp"]
    environment:
      TZ: ${TZ:-America/New_York}
      WEBPASSWORD: ${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
    volumes:
      - pihole_etc:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
    cap_add: [NET_ADMIN]
    profiles: [security]

  wireguard:
    <<: *common
    image: lscr.io/linuxserver/wireguard:latest
    ports: ["51820:51820/udp"]
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
    volumes:
      - wireguard_config:/config
      - /lib/modules:/lib/modules:ro
    profiles: [security]

  vaultwarden:
    <<: *common
    image: vaultwarden/server:latest
    ports: ["8020:80"]
    volumes:
      - vaultwarden_data:/data
    profiles: [security]

  # Gluetun is gated behind its OWN opt-in profile (not `security`) because it
  # needs a host `/dev/net/tun` device node that unprivileged LXC/incus
  # containers don't have by default. Keeping it out of `security` means a plain
  # `up -d`, `--profile security`, or `--profile "*"` never errors on hosts
  # without tun. Opt in explicitly once the host provides the device:
  #   docker compose --profile vpn up -d
  gluetun:
    <<: *common
    image: qmcgaw/gluetun:latest
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    ports: ["8888:8888/tcp"]
    environment:
      TZ: ${TZ:-America/New_York}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-custom}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
    profiles: [vpn]

# ============================================================================
#  DEVOPS — The DragonForge Core  (--profile devops)
# ============================================================================
  gitea:
    <<: *common
    image: gitea/gitea:latest
    ports: ["3000:3000", "2222:22"]
    volumes:
      - gitea_data:/data
    environment:
      TZ: ${TZ:-America/New_York}
      GITEA__database__DB_TYPE: sqlite3
      USER_UID: ${PUID:-1000}
      USER_GID: ${PGID:-1000}
    profiles: [devops]

  semaphore:
    <<: *common
    # Pinned: :latest (>=v2.18.12) is a pro build that panics on BoltDB
    # ("unknown store type" in NewTerraformStore, upstream issue #4126).
    # v2.18.10 is the last known-good release on bolt.
    image: semaphoreui/semaphore:v2.18.10
    ports: ["3010:3000"]
    environment:
      TZ: ${TZ:-America/New_York}
      SEMAPHORE_DB_DIALECT: bolt
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN:-admin}
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD:?set SEMAPHORE_ADMIN_PASSWORD in .env}
      SEMAPHORE_ADMIN_NAME: ${SEMAPHORE_ADMIN_NAME:-Admin}
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL:-admin@forgebox.local}
    volumes:
      - semaphore_data:/var/lib/semaphore
    profiles: [devops]

  jenkins:
    <<: *common
    image: jenkins/jenkins:lts-jdk17
    user: root
    ports: ["8081:8080", "50000:50000"]
    volumes:
      - jenkins_home:/var/jenkins_home
    profiles: [devops]

  code-server:
    <<: *common
    image: lscr.io/linuxserver/code-server:latest
    # 8444 (8443 is Heimdall's HTTPS port in core)
    ports: ["8444:8443"]
    environment:
      # linuxserver image defaults to auth: none — an open browser IDE with shell
      # access. Gate it: PASSWORD sets the login prompt. Seeded from .env.
      PASSWORD: ${CODE_SERVER_PASSWORD:-change-me}
    volumes:
      - code_server_config:/config
    profiles: [devops]

  guacamole:
    <<: *common
    image: flcontainers/guacamole:latest
    ports: ["8082:8080"]
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - guacamole_data:/config
    profiles: [devops]

# ============================================================================
#  MEDIA  (--profile media)
# ============================================================================
  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin:latest
    ports: ["8096:8096"]
    volumes:
      - jellyfin_config:/config
      - ${MEDIA_PATH:-./data/media}:/data/media
    profiles: [media]

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    ports: ["8989:8989"]
    volumes:
      - sonarr_config:/config
      - ${MEDIA_PATH:-./data/media}:/data/media
    profiles: [media]

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    ports: ["7878:7878"]
    volumes:
      - radarr_config:/config
      - ${MEDIA_PATH:-./data/media}:/data/media
    profiles: [media]

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    ports: ["9696:9696"]
    volumes:
      - prowlarr_config:/config
    profiles: [media]

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest
    ports: ["8085:8085"]
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      WEBUI_PORT: "8085"
    volumes:
      - qbittorrent_config:/config
      - ${MEDIA_PATH:-./data/media}:/data/media
    profiles: [media]

  overseerr:
    <<: *common
    image: sctx/overseerr:latest
    ports: ["5055:5055"]
    volumes:
      - overseerr_config:/config
    profiles: [media]

# ============================================================================
#  PRODUCTIVITY  (--profile productivity)
# ============================================================================
  homeassistant:
    restart: unless-stopped
    image: ghcr.io/home-assistant/home-assistant:stable
    # Home Assistant needs host networking for device discovery (mDNS etc.),
    # so it does NOT use the shared *common anchor (which sets `networks`).
    network_mode: host
    privileged: true
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - homeassistant_config:/config
      - /etc/localtime:/etc/localtime:ro
    profiles: [productivity]

  paperless-ngx:
    <<: *common
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    ports: ["8011:8000"]
    environment:
      TZ: ${TZ:-America/New_York}
      PAPERLESS_REDIS: redis://paperless_redis:6379
      PAPERLESS_DBHOST: paperless_db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS:-paperless}
      # Paperless-ngx refuses to boot if this is left at the placeholder, by
      # design. install.sh seeds a unique value into .env before deploying;
      # change-me here keeps that refusal explicit rather than silent.
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-change-me}
      PAPERLESS_URL: ${PAPERLESS_URL:-http://localhost:8011}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-eng}
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - ${PAPERLESS_CONSUME:-./data/consume}:/usr/src/paperless/consume
    depends_on: [paperless_redis, paperless_db]
    profiles: [productivity]

  paperless_redis:
    <<: *common
    image: redis:7
    volumes:
      - paperless_redis_data:/data
    profiles: [productivity]

  paperless_db:
    <<: *common
    image: postgres:16
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS:-paperless}
      # PGDATA is set explicitly so the path never comes from the image tag.
      # The postgres 18 line moved the default to /var/lib/postgresql/18/docker;
      # a container mounting the old path would start a *fresh empty* cluster,
      # report healthy, and serve an empty paperless while the real data sat
      # invisible on the volume. Pin the 16 minor exactly as well.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - paperless_db_data:/var/lib/postgresql/data
    profiles: [productivity]

  vikunja:
    <<: *common
    image: vikunja/vikunja:latest
    # Vikunja's image ships /app/vikunja/files owned by root and the process
    # runs as uid 1000. Under a user-namespace/rootless Docker (or a fresh
    # named volume Docker initializes as root:root) the uid-1000 process
    # cannot write it and the container crash-loops with
    # "Could not init file handler: ... permission denied". Running as root
    # inside the container is Vikunja's documented workaround for this case.
    user: "0"
    ports: ["3456:3456"]
    environment:
      TZ: ${TZ:-America/New_York}
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_URL:-http://localhost:3456}
      VIKUNJA_DATABASE_TYPE: sqlite
    volumes:
      - vikunja_data:/app/vikunja/files
      # Vikunja's default SQLite config writes to /db/vikunja.db; without a
      # volume at /db the process can't create the DB and crash-loops with
      # "could not open database file ... /db/vikunja.db: no such file or
      # directory". This mirrors Vikunja's documented compose.
      - vikunja_db:/db
    profiles: [productivity]

  linkding:
    <<: *common
    image: sissbruecker/linkding:latest
    ports: ["9090:9090"]
    volumes:
      - linkding_data:/etc/linkding/data
    profiles: [productivity]

  n8n:
    <<: *common
    image: docker.n8n.io/n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      TZ: ${TZ:-America/New_York}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      GENERIC_TIMEZONE: ${TZ:-America/New_York}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-changeme}
    volumes:
      - n8n_data:/home/node/.n8n
    profiles: [productivity]

# ============================================================================
#  FILES  (--profile files)
# ============================================================================
  nextcloud:
    <<: *common
    image: lscr.io/linuxserver/nextcloud:latest
    # lsio's nextcloud runs nginx on 80 inside the container — there is no 443
    # listener. Front it with nginx-proxy-manager (core profile) for TLS.
    ports: ["8030:80"]
    volumes:
      - nextcloud_config:/config
      - nextcloud_data:/data
    profiles: [files]

  syncthing:
    <<: *common
    image: lscr.io/linuxserver/syncthing:latest
    ports: ["8384:8384", "22000:22000/tcp", "22000:22000/udp", "21027:21027/udp"]
    volumes:
      - syncthing_config:/config
    profiles: [files]

  chibisafe:
    <<: *common
    image: chibisafe/chibisafe:latest
    # Chibisafe v4 (Next.js) listens on 8001 inside the container (image sets
    # PORT=8001); mapping 8000 leaves nothing listening and connections reset.
    ports: ["8040:8001"]
    volumes:
      - chibisafe_data:/app/database
      - chibisafe_uploads:/app/uploads
    profiles: [files]

# ============================================================================
#  AGGREGATE PROFILES  —  `--profile "*"` brings up everything optional
# ============================================================================
  # (Profiles compose additively. There is no profile literally named `all`, so
  #  `--profile all` matches nothing and silently starts core only — use the
  #  wildcard `--profile "*"` (quotes required) to enable every profile, or
  #  enumerate them: --profile devops --profile media ... See docs/quick-start.md.)

volumes:
  # core
  portainer_data:
  heimdall_config:
  npm_data:
  npm_letsencrypt:
  uptime_kuma_data:
  # security
  pihole_etc:
  pihole_dnsmasq:
  wireguard_config:
  vaultwarden_data:
  # devops
  gitea_data:
  semaphore_data:
  jenkins_home:
  code_server_config:
  guacamole_data:
  # media
  jellyfin_config:
  sonarr_config:
  radarr_config:
  prowlarr_config:
  qbittorrent_config:
  overseerr_config:
  # productivity
  homeassistant_config:
  paperless_data:
  paperless_media:
  paperless_redis_data:
  paperless_db_data:
  vikunja_data:
  vikunja_db:
  linkding_data:
  n8n_data:
  # files
  nextcloud_config:
  nextcloud_data:
  syncthing_config:
  chibisafe_data:
  chibisafe_uploads:
